name: Actualizar guías AEPD

on:
  # Cada día a las 07:17 UTC (hora española de mañana)
  schedule:
    - cron: '17 7 * * *'
  # Botón "Run workflow" manual en la pestaña Actions de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scrap_aepd.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guias_aepd.json
          if git diff --staged --quiet; then
            echo "No hay cambios que commitar"
          else
            git commit -m "🔄 Actualización automática guías AEPD $(date -u +%F)"
            git push
          fi
