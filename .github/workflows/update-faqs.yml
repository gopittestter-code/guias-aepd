name: 🔄 Actualizar FAQs

on:
  schedule:
    - cron: '0 3 * * 1'   # Cada lunes a las 03:00 UTC
  workflow_dispatch: {}    # Permite lanzarlo manualmente desde GitHub

permissions:
  contents: write          # Necesario para hacer commit y push

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        run: python scraper/scraper.py

      - name: Validar JSON generado
        run: python -c "import json; json.load(open('data/faq_data.json'))"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "FAQ Hub Bot"
          git config user.email "faqhub-bot@users.noreply.github.com"
          git add data/faq_data.json
          if git diff --staged --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "🤖 Actualización automática de FAQs ($(date +'%Y-%m-%d'))"
            git push
          fi
